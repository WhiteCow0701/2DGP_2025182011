<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#b84a18"/>
    </marker>
    <style>
      .state { fill: #eef5ff; stroke: #1d5d9b; stroke-width: 3; }
      .label { font: 24px sans-serif; fill: #16324f; text-anchor: middle; }
      .edge { stroke: #b84a18; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { font: 18px sans-serif; fill: #333; text-anchor: middle; }
      .title { font: bold 32px sans-serif; fill: #222; text-anchor: middle; }
    </style>
  </defs>
  <text x="600" y="45" class="title">Boy State Diagram - AutoRun</text>
  <rect x="90" y="250" width="180" height="80" rx="18" class="state"/>
  <text x="180" y="300" class="label">IDLE</text>
  <rect x="470" y="90" width="230" height="80" rx="18" class="state"/>
  <text x="585" y="140" class="label">AUTORUN</text>
  <rect x="470" y="420" width="180" height="80" rx="18" class="state"/>
  <text x="560" y="470" class="label">RUN</text>
  <rect x="900" y="250" width="180" height="80" rx="18" class="state"/>
  <text x="990" y="300" class="label">SLEEP</text>
  <path d="M270 270 C350 220 390 150 470 135" class="edge"/>
  <text x="360" y="185" class="note">a 키</text>
  <path d="M700 135 C790 150 840 220 900 270" class="edge"/>
  <text x="800" y="185" class="note">5초 경과</text>
  <path d="M470 155 C380 190 350 245 270 270" class="edge"/>
  <text x="360" y="245" class="note">5초 경과</text>
  <path d="M540 170 L540 420" class="edge"/>
  <text x="615" y="300" class="note">방향키</text>
  <path d="M650 460 C760 430 800 350 900 320" class="edge"/>
  <text x="790" y="400" class="note">방향키 해제</text>
  <path d="M900 285 C800 250 730 210 700 160" class="edge"/>
  <text x="790" y="245" class="note">스페이스바</text>
  <path d="M270 310 C360 380 420 450 470 460" class="edge"/>
  <text x="365" y="390" class="note">방향키</text>
</svg>
