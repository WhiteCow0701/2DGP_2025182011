<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#263238"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#fafafa"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="30" font-weight="bold" fill="#263238">Boy State Diagram</text>

  <!-- Initial state -->
  <circle cx="92" cy="170" r="13" fill="#263238"/>
  <line x1="105" y1="170" x2="205" y2="170" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="112" y="145" font-family="Arial, sans-serif" font-size="18" fill="#455a64">initial</text>

  <!-- States -->
  <g filter="url(#shadow)">
    <rect x="205" y="115" width="220" height="110" rx="22" fill="#d9efff" stroke="#1976d2" stroke-width="3"/>
    <rect x="490" y="115" width="220" height="110" rx="22" fill="#fff0d6" stroke="#ef6c00" stroke-width="3"/>
    <rect x="775" y="115" width="220" height="110" rx="22" fill="#dff5df" stroke="#2e7d32" stroke-width="3"/>
  </g>
  <text x="315" y="180" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#0d47a1">IDLE</text>
  <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#e65100">RUN</text>
  <text x="885" y="180" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#1b5e20">SLEEP</text>

  <!-- IDLE to RUN -->
  <path d="M425 160 C450 160 465 160 490 160" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="457" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#263238">LEFT / RIGHT keydown</text>

  <!-- RUN to IDLE -->
  <path d="M490 205 C465 275 350 275 290 225" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="390" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#263238">LEFT / RIGHT keyup</text>

  <!-- IDLE to SLEEP -->
  <path d="M370 225 C455 385 745 385 830 225" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#263238">5 seconds elapsed</text>

  <!-- SLEEP to IDLE -->
  <path d="M775 195 C690 470 350 470 255 225" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="515" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#263238">SPACE keydown / wake_up()</text>

  <!-- SLEEP to RUN -->
  <path d="M775 145 C745 85 680 85 650 115" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="715" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#263238">LEFT / RIGHT keydown</text>

  <!-- Space behavior -->
  <rect x="170" y="555" width="860" height="125" rx="18" fill="#ffffff" stroke="#78909c" stroke-width="2"/>
  <text x="600" y="590" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21" font-weight="bold" fill="#37474f">SPACE key behavior</text>
  <text x="600" y="625" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#37474f">IDLE / RUN: print "Ball fired to the right/left" based on face_dir</text>
  <text x="600" y="653" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#37474f">SLEEP: wake_up() - no ball firing</text>
</svg>
